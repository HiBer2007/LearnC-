# 应用配置示例（INI 风格）
# 语法：[段] 开头，其余行写 键 = 值
#       # 与 ; 开头的整行是注释，行尾注释同样支持
#       值可以是 true/false、整数、小数，其余按字符串处理
#       字符串可以加双引号，引号里的 # 不当注释

[app]
name = text-analyzer
version = 1.40
debug = false

[run]
top = 8                 # 词频榜取前几名
min_length = 3          # 短于这个长度的词丢掉
lowercase = true        # 统计前统一转小写
ratio = 0.75            # 采样比例
timeout = 30            ; 单位：秒
window = 1280x720
motto = "stay # simple"

[paths]
input = data/corpus.txt
output = data/report.txt

[broken]
# 下一行故意少写一个等号，用来看解析器怎么报错
missing_equals
